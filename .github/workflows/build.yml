name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "11.0.x"
  DOTNET_CHANNEL: "preview"
  NODE_VERSION: "24"

jobs:
  build-svelte:
    name: Build Svelte frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/ME221Dashboard/SvelteApp/package-lock.json

      - run: npm ci
        working-directory: src/ME221Dashboard/SvelteApp

      - run: npm run build
        working-directory: src/ME221Dashboard/SvelteApp

      - uses: actions/upload-artifact@v4
        with:
          name: svelte-wwwroot
          path: src/ME221Dashboard/wwwroot/
          retention-days: 1

  build-android:
    name: Android (arm64)
    needs: build-svelte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: svelte-wwwroot
          path: src/ME221Dashboard/wwwroot/

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_CHANNEL }}

      # The action defaults to "tools platform-tools", but the legacy "tools"
      # package was retired from the SDK repository, so only ask for platform-tools.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Restore MAUI workloads
        run: dotnet workload restore src/ME221Dashboard/ME221Dashboard.csproj

      - name: Build (Android, arm64)
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/ME221Dashboard/ME221Dashboard.csproj \
            -f net11.0-android37.0 \
            -c Release \
            -p:EnableWindowsTargeting=true 2>&1 | tee build-android.log

      - name: Surface Android build errors
        if: failure()
        shell: bash
        run: bash .github/scripts/surface-build-errors.sh Android build-android.log

      - uses: actions/upload-artifact@v4
        with:
          name: me221-android-arm64
          path: src/ME221Dashboard/bin/Release/net11.0-android37.0/*.apk
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Windows
    needs: build-svelte
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: svelte-wwwroot
          path: src/ME221Dashboard/wwwroot/

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_CHANNEL }}

      - name: Restore MAUI workloads
        run: dotnet workload restore src/ME221Dashboard/ME221Dashboard.csproj

      - name: Build (Windows)
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/ME221Dashboard/ME221Dashboard.csproj \
            -f net11.0-windows10.0.19041.0 \
            -c Release 2>&1 | tee build-windows.log

      - name: Surface Windows build errors
        if: failure()
        shell: bash
        run: bash .github/scripts/surface-build-errors.sh Windows build-windows.log

      - uses: actions/upload-artifact@v4
        with:
          name: me221-windows
          path: src/ME221Dashboard/bin/Release/net11.0-windows10.0.19041.0/
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: macOS (Catalyst)
    needs: build-svelte
    # .NET 11 for Mac Catalyst (27.0.x workload) refuses to build against anything
    # below Xcode 27, and macos-latest only ships Xcode 26.x. The dedicated
    # xcode-27 image is the only one with Xcode 27 installed, so builds run there;
    # it ships a single default Xcode, so no selection step is needed. Revisit the
    # label once that image is out of preview and macos-latest picks up Xcode 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: svelte-wwwroot
          path: src/ME221Dashboard/wwwroot/

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_CHANNEL }}

      - name: Restore MAUI workloads
        run: dotnet workload restore src/ME221Dashboard/ME221Dashboard.csproj

      - name: Build (Mac Catalyst)
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/ME221Dashboard/ME221Dashboard.csproj \
            -f net11.0-maccatalyst \
            -c Release 2>&1 | tee build-macos.log

      - name: Surface macOS build errors
        if: failure()
        shell: bash
        run: bash .github/scripts/surface-build-errors.sh macOS build-macos.log

      - uses: actions/upload-artifact@v4
        with:
          name: me221-macos
          path: src/ME221Dashboard/bin/Release/net11.0-maccatalyst/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: ${{ env.DOTNET_CHANNEL }}

      # Run tests on individual projects to avoid restoring the MAUI project
      # (which requires platform-specific workload packs).
      - run: |
          dotnet test tests/ME221.Comms.Tests/ME221.Comms.Tests.csproj -c Release --verbosity minimal
          dotnet test tests/ME221.Data.Tests/ME221.Data.Tests.csproj -c Release --verbosity minimal