<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ME221 — Gauge Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0A0A0A;--surface:#1A1A1A;--card:#222222;--card-hover:#2A2A2A;
  --border:#333333;--border-s:#1F1F1F;--input-bg:#1A1A1A;--input-bd:#444444;
  --text:#FFFFFF;--text-2:#A0A0A0;--text-3:#666666;
  --blue:#0078D7;--blue-dk:#005A9E;--blue-lt:#1A8AE0;
  --green:#107C10;--red:#E81123;--orange:#D83B01;--purple:#6B2C91;--amber:#F59F00;--yellow:#FFB900;--teal:#00A5A5;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'Cascadia Code','JetBrains Mono','Fira Code',monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;flex-direction:column}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;min-height:36px}
.hdr-l{display:flex;align-items:center;gap:8px}
.hdr-title{font-family:'Orbitron',sans-serif;font-weight:700;font-size:11px;letter-spacing:.1em;color:var(--blue)}
.stp{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border:1px solid transparent;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
.stp.a{color:var(--blue);border-color:var(--blue);background:rgba(0,120,215,.08)}
.stp.d{color:var(--green);border-color:var(--green);background:rgba(16,124,16,.08)}
.stp-n{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;border:1px solid currentColor;line-height:1}
.stp.a .stp-n{background:var(--blue);color:#fff;border-color:var(--blue)}
.stp.d .stp-n{background:var(--green);color:#fff;border-color:var(--green)}
.stp-arr{color:var(--text-3);font-size:10px;margin:0 1px}
.hdr-r{display:flex;gap:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:4px 10px;border:none;font-family:var(--font);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;transition:background .12s;border-radius:0}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(180deg,var(--blue),var(--blue-dk));color:#fff}
.btn-s{background:transparent;border:1px solid var(--input-bd);color:var(--text-2)}
.btn-s:hover{border-color:var(--text-3);color:var(--text)}
.btn-d{background:var(--red);color:#fff}
.btn-icon{width:24px;height:24px;padding:0;background:transparent;border:1px solid var(--border);color:var(--text-3);font-size:12px}
.btn-icon:hover{border-color:var(--text-3);color:var(--text)}
.btn-icon.dng:hover{border-color:var(--red);color:var(--red)}

.main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.main.s2{display:none}.main.s2.show{display:flex}.main.s1.hide{display:none}

/* ─── LIST ─── */
.lst{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lst-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;text-align:center}
.lst-empty .ic{font-size:28px;color:var(--text-3);margin-bottom:8px}
.lst-empty .tx{font-size:11px;color:var(--text-3);font-weight:600}
.lst-empty .sub{font-size:9px;color:var(--text-3);margin-top:4px;line-height:1.5}

/* Row */
.row{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border-s);cursor:pointer;transition:background .1s;min-height:40px}
.row:hover{background:var(--card)}
.row:active{background:var(--card-hover)}
.row-dot{width:3px;align-self:stretch;border-radius:1px;flex-shrink:0}
.row-type{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid var(--border);flex-shrink:0;color:var(--text-2)}
.row-info{flex:1;min-width:0;display:flex;align-items:center;gap:6px;min-width:0}
.row-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.row-sep{color:var(--border);font-size:8px}
.row-ent{font-size:10px;font-weight:500;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-unit{font-size:8px;color:var(--text-3);font-family:var(--mono);white-space:nowrap;flex-shrink:0}
.row-acts{display:flex;gap:3px;flex-shrink:0}

/* Multi-ring sub-items */
.row-multi{padding:0;border-bottom:none}
.rm-item{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 42px;border-bottom:1px solid var(--border-s);font-size:9px;min-height:28px}
.rm-item:last-child{border-bottom:none}
.rm-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.rm-name{flex:1;font-weight:500;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-unit{color:var(--text-3);font-family:var(--mono);font-size:8px;flex-shrink:0}
.rm-add{display:flex;align-items:center;justify-content:center;padding:3px 10px 3px 42px;font-size:8px;color:var(--text-3);cursor:pointer;border-bottom:1px solid var(--border-s)}
.rm-add:hover{color:var(--blue)}

/* ─── FAB ─── */
.fab{position:fixed;bottom:10px;right:10px;z-index:30;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,var(--blue),var(--blue-dk));color:#fff;border:none;font-size:20px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,120,215,.3)}
.fab:active{transform:scale(.92)}

/* ─── REVIEW ─── */
.review{flex:1;overflow-y:auto;padding:10px}
.rv-head{text-align:center;padding:12px 0 10px}
.rv-head h2{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--blue)}
.rv-head p{font-size:9px;color:var(--text-3);margin-top:3px}
.rv-list{max-width:400px;margin:0 auto}
.rv-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--border-s);font-size:10px}
.rv-row .dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.rv-row .tp{font-weight:700;text-transform:uppercase;letter-spacing:.04em;width:60px;flex-shrink:0}
.rv-row .ent{flex:1;color:var(--text-2)}
.rv-row .unit{color:var(--text-3);font-family:var(--mono);font-size:8px}
.rv-empty{text-align:center;padding:16px;font-size:9px;color:var(--text-3);font-style:italic}
.rv-actions{display:flex;gap:6px;justify-content:center;padding:14px 0 20px}

/* ─── SHEET ─── */
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-mask.show{display:flex}
.sheet{width:100%;max-width:480px;max-height:65dvh;background:var(--surface);border:1px solid var(--border);border-bottom:none;display:flex;flex-direction:column;animation:su .15s ease-out}
@keyframes su{from{transform:translateY(100%);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--border)}
.sheet-hdr h3{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:5px}
.sheet-hdr h3 .d{width:5px;height:5px;border-radius:50%}
.sheet-x{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--text-3);font-size:13px;cursor:pointer}
.sheet-bd{flex:1;overflow-y:auto;padding:6px 10px 14px}
.sheet-search{width:100%;padding:5px 7px;border:1px solid var(--input-bd);background:var(--input-bg);color:var(--text);font-family:var(--font);font-size:10px;outline:none;margin-bottom:6px;border-radius:0}
.sheet-search:focus{border-color:var(--blue)}
.sheet-search::placeholder{color:var(--text-3)}

/* Type items */
.ti{display:flex;align-items:center;gap:8px;padding:6px 7px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:border-color .1s,background .1s;margin-bottom:3px}
.ti:hover{background:var(--card-hover);border-color:var(--text-3)}
.ti-ic{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);font-size:12px;flex-shrink:0}
.ti-nm{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;flex:1}
.ti-desc{font-size:8px;color:var(--text-3);margin-top:1px}
.ti-badge{font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 4px;border:1px solid var(--border);color:var(--text-3);flex-shrink:0}

/* Entity items */
.ei{display:flex;align-items:center;gap:7px;padding:5px 7px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:border-color .1s,background .1s;margin-bottom:2px}
.ei:hover{background:var(--card-hover);border-color:var(--text-3)}
.ei.used{opacity:.3;pointer-events:none}
.ei.sel{border-color:var(--blue);background:rgba(0,120,215,.06)}
.ei-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.ei-nm{font-size:10px;font-weight:600;flex:1}
.ei-unit{font-size:8px;color:var(--text-3);font-family:var(--mono)}
.ei-chk{width:13px;height:13px;border:1px solid var(--input-bd);display:flex;align-items:center;justify-content:center;font-size:8px;color:transparent;flex-shrink:0}
.ei.sel .ei-chk{border-color:var(--blue);background:var(--blue);color:#fff}

/* Color dots */
.cd-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--border-s);font-size:9px}
.cd-row:last-child{border-bottom:none}
.cd-lbl{flex:1;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd-dots{display:flex;gap:3px}
.cd-dot{width:14px;height:14px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.cd-dot:hover,.cd-dot.on{border-color:var(--text)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-l">
    <span class="hdr-title">GAUGE BUILDER</span>
    <span class="stp a" id="stp1"><span class="stp-n">1</span> BUILD</span>
    <span class="stp-arr">▸</span>
    <span class="stp" id="stp2"><span class="stp-n">2</span> REVIEW</span>
  </div>
  <div class="hdr-r">
    <button class="btn btn-d" onclick="resetAll()">RESET</button>
    <button class="btn btn-p" id="nextBtn" onclick="goStep2()">REVIEW ▸</button>
  </div>
</div>

<div class="main s1" id="step1">
  <div class="lst" id="list"></div>
  <button class="fab" onclick="openTypeSheet()">+</button>
</div>

<div class="main s2" id="step2">
  <div class="review">
    <div class="rv-head"><h2>CONFIG SUMMARY</h2><p>Tap ← Back to edit. On the dashboard, drag to position.</p></div>
    <div class="rv-list" id="rvList"></div>
    <div class="rv-actions">
      <button class="btn btn-s" onclick="goStep1()">◂ BACK</button>
      <button class="btn btn-p">SAVE</button>
    </div>
  </div>
</div>

<!-- TYPE SHEET -->
<div class="sheet-mask" id="typeMask" onclick="if(event.target===this)closeSheet('type')">
  <div class="sheet">
    <div class="sheet-hdr"><h3>NEW GAUGE</h3><button class="sheet-x" onclick="closeSheet('type')">×</button></div>
    <div class="sheet-bd" id="typeList"></div>
  </div>
</div>

<!-- ENTITY SHEET -->
<div class="sheet-mask" id="entMask" onclick="if(event.target===this)closeSheet('ent')">
  <div class="sheet">
    <div class="sheet-hdr"><h3 id="entTitle">ASSIGN ENTITY</h3><button class="sheet-x" onclick="closeSheet('ent')">×</button></div>
    <div class="sheet-bd">
      <input class="sheet-search" id="entSearch" placeholder="Search..." oninput="renderEntPicker()">
      <div id="entList"></div>
    </div>
  </div>
</div>

<script>
const TYPES=[
  {type:'arc',name:'Arc',icon:'◎',color:'#0078D7',desc:'Sweep + needle',ents:'1'},
  {type:'bar',name:'Bar',icon:'▬',color:'#00A5A5',desc:'Segmented bar',ents:'1'},
  {type:'text',name:'Text',icon:'Aa',color:'#A0A0A0',desc:'Numeric value',ents:'1'},
  {type:'digital',name:'Digital',icon:'▯',color:'#107C10',desc:'7-segment / odometer',ents:'1'},
  {type:'chart',name:'Chart',icon:'〜',color:'#D83B01',desc:'Live line graph',ents:'1'},
  {type:'wedge',name:'Wedge',icon:'◧',color:'#F59F00',desc:'Fiat Uno wedge bar',ents:'1'},
  {type:'ledring',name:'LED Ring',icon:'◉',color:'#6B2C91',desc:'Circular LED segments',ents:'1'},
  {type:'multiring',name:'Multi-Ring',icon:'◎+',color:'#FFB900',desc:'Concentric arcs',ents:'1–5'},
];
const RC=['#0078D7','#107C10','#F59F00','#E81123','#6B2C91'];
const ENT=[
  {id:42,name:'RPM',unit:'rpm'},{id:43,name:'Coolant Temp',unit:'°C'},
  {id:44,name:'Oil Pressure',unit:'bar'},{id:45,name:'Oil Temp',unit:'°C'},
  {id:46,name:'Boost',unit:'psi'},{id:47,name:'AFR',unit:''},
  {id:48,name:'TPS',unit:'%'},{id:49,name:'MAP',unit:'kPa'},
  {id:50,name:'Ignition Adv',unit:'°'},{id:51,name:'Inj. Duty',unit:'%'},
  {id:52,name:'Lambda',unit:'λ'},{id:53,name:'Battery',unit:'V'},
  {id:-1001,name:'GPS Speed',unit:'km/h'},{id:-2001,name:'Odometer',unit:'km'},
];
const C={arc:'#0078D7',bar:'#00A5A5',text:'#A0A0A0',digital:'#107C10',chart:'#D83B01',wedge:'#F59F00',ledring:'#6B2C91',multiring:'#FFB900'};

let G=[],nid=1,editId=null,entMode=null;

function renderList(){
  const el=document.getElementById('list');
  if(!G.length){
    el.innerHTML=`<div class="lst-empty"><div class="ic">+</div><div class="tx">NO GAUGES</div><div class="sub">Tap + to add your first gauge</div></div>`;
    return;
  }
  let h='';
  for(const g of G){
    const t=TYPES.find(x=>x.type===g.type);const col=C[g.type];
    const eName=g.primary!=null?ENT.find(x=>x.id===g.primary):null;
    if(g.type==='multiring'){
      h+=`<div class="row" onclick="openProps(${g.id})">
        <div class="row-dot" style="background:${col}"></div>
        <div class="row-type" style="color:${col};border-color:${col}30">${t.icon}</div>
        <div class="row-info"><span class="row-name" style="color:${col}">${t.name}</span><span class="row-sep">·</span><span class="row-ent">${g.linked.length?g.linked.length+' entit'+(g.linked.length===1?'y':'ies'):'none'}</span></div>
        <div class="row-acts"><button class="btn-icon dng" onclick="event.stopPropagation();rmGauge(${g.id})">×</button></div>
      </div>`;
      for(const l of g.linked){
        const le=ENT.find(x=>x.id===l.id);
        h+=`<div class="rm-item"><div class="rm-dot" style="background:${l.color}"></div><span class="rm-name">${le?.name||l.id}</span><span class="rm-unit">${le?.unit||''}</span></div>`;
      }
      if(g.linked.length<5) h+=`<div class="rm-add" onclick="event.stopPropagation();openEntSheet(${g.id})">+ add entity</div>`;
    } else {
      h+=`<div class="row" onclick="openProps(${g.id})">
        <div class="row-dot" style="background:${col}"></div>
        <div class="row-type" style="color:${col};border-color:${col}30">${t.icon}</div>
        <div class="row-info">
          <span class="row-name" style="color:${col}">${t.name}</span>
          <span class="row-sep">·</span>
          <span class="row-ent">${eName?eName.name:'—'}</span>
          <span class="row-unit">${eName?.unit||''}</span>
        </div>
        <div class="row-acts"><button class="btn-icon dng" onclick="event.stopPropagation();rmGauge(${g.id})">×</button></div>
      </div>`;
    }
  }
  el.innerHTML=h;
}

function openTypeSheet(){
  document.getElementById('typeList').innerHTML=TYPES.map(t=>
    `<div class="ti" onclick="addGauge('${t.type}')">
      <div class="ti-ic" style="color:${t.color};border-color:${t.color}30">${t.icon}</div>
      <div style="flex:1;min-width:0"><div class="ti-nm" style="color:${t.color}">${t.name}</div><div class="ti-desc">${t.desc}</div></div>
      <div class="ti-badge">${t.ents} ENT</div>
    </div>`
  ).join('');
  document.getElementById('typeMask').classList.add('show');
}

function addGauge(type){
  const g={id:nid++,type,primary:null,linked:[]};
  G.push(g);editId=g.id;closeSheet('type');renderList();
  if(type==='multiring') openEntSheet(g.id);
}

function openEntSheet(gid){
  editId=gid;entMode='set';
  const g=G.find(x=>x.id===gid);const t=TYPES.find(x=>x.type===g.type);const col=C[g.type];
  document.getElementById('entTitle').innerHTML=`<span class="d" style="background:${col}"></span> ${t.name}`;
  document.getElementById('entSearch').value='';
  renderEntPicker();
  document.getElementById('entMask').classList.add('show');
}

function renderEntPicker(){
  const f=document.getElementById('entSearch').value.toLowerCase();
  const g=G.find(x=>x.id===editId);
  const used=new Set();
  if(g){if(g.primary!=null)used.add(g.primary);for(const l of g.linked)used.add(l.id);}
  const list=ENT.filter(e=>!f||e.name.toLowerCase().includes(f)||e.unit.toLowerCase().includes(f));
  const col=g?C[g.type]:'#0078D7';
  document.getElementById('entList').innerHTML=list.map(e=>{
    const isSel=g&&(g.primary===e.id||g.linked.find(l=>l.id===e.id));
    return `<div class="ei${isSel?' sel':''}" onclick="pickEnt(${e.id})">
      <div class="ei-dot" style="background:${col}"></div>
      <span class="ei-nm">${e.name}</span>
      <span class="ei-unit">${e.unit||'—'}</span>
      <div class="ei-chk">${isSel?'✓':''}</div>
    </div>`;
  }).join('');
}

function pickEnt(eid){
  const g=G.find(x=>x.id===editId);if(!g)return;
  if(g.type==='multiring'){
    const idx=g.linked.findIndex(l=>l.id===eid);
    if(idx>=0)g.linked.splice(idx,1);
    else if(g.linked.length<5)g.linked.push({id:eid,color:RC[g.linked.length%5]});
    renderEntPicker();renderList();
  } else {
    g.primary=g.primary===eid?null:eid;
    closeSheet('ent');renderList();
  }
}

function openProps(gid){
  editId=gid;
  const g=G.find(x=>x.id===gid);const t=TYPES.find(x=>x.type===g.type);const col=C[g.type];
  document.getElementById('entTitle').innerHTML=`<span class="d" style="background:${col}"></span> ${t.name} — EDIT`;
  let h='';
  if(g.type==='multiring'){
    if(g.linked.length){
      h+=g.linked.map(l=>{
        const e=ENT.find(x=>x.id===l.id);
        return `<div style="display:flex;align-items:center;gap:5px;padding:4px 0;border-bottom:1px solid var(--border-s)">
          <span style="width:5px;height:5px;border-radius:50%;background:${l.color};flex-shrink:0"></span>
          <span style="flex:1;font-size:10px;font-weight:600">${e?.name||l.id}</span>
          <span style="font-size:8px;color:var(--text-3);font-family:var(--mono)">${e?.unit||''}</span>
          <button class="btn-icon dng" style="width:18px;height:18px;font-size:8px" onclick="rmLinked(${gid},${l.id})">×</button>
        </div>`;
      }).join('');
      h+=`<div style="margin-top:6px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:4px">RING COLORS</div>`;
      for(const l of g.linked){
        const e=ENT.find(x=>x.id===l.id);
        h+=`<div class="cd-row"><span class="cd-lbl">${e?.name||l.id}</span><div class="cd-dots">${RC.map(c=>`<div class="cd-dot${l.color===c?' on':''}" style="background:${c}" onclick="setRC(${gid},${l.id},'${c}')"></div>`).join('')}</div></div>`;
      }
    }
    if(g.linked.length<5) h+=`<button class="btn btn-s" style="width:100%;margin-top:8px;font-size:9px;padding:5px" onclick="openEntSheet(${gid})">+ ADD ENTITY</button>`;
  } else {
    const e=g.primary!=null?ENT.find(x=>x.id===g.primary):null;
    if(e){
      h+=`<div style="display:flex;align-items:center;gap:5px;padding:5px 0;border-bottom:1px solid var(--border-s)">
        <span style="width:5px;height:5px;border-radius:50%;background:${col};flex-shrink:0"></span>
        <span style="flex:1;font-size:10px;font-weight:600">${e.name}</span>
        <span style="font-size:8px;color:var(--text-3);font-family:var(--mono)">${e.unit||''}</span>
        <button class="btn-icon dng" style="width:18px;height:18px;font-size:8px" onclick="rmPrimary(${gid})">×</button>
      </div>`;
    }
    h+=`<button class="btn btn-s" style="width:100%;margin-top:8px;font-size:9px;padding:5px" onclick="openEntSheet(${gid})">${e?'CHANGE':'ASSIGN'} ENTITY</button>`;
  }
  h+=`<button class="btn btn-d" style="width:100%;margin-top:8px" onclick="rmGauge(${gid});closeSheet('ent')">DELETE</button>`;
  document.getElementById('entList').innerHTML=h;
  document.getElementById('entSearch').style.display='none';
  document.getElementById('entMask').classList.add('show');
}

function rmPrimary(gid){const g=G.find(x=>x.id===gid);if(g)g.primary=null;renderList();openProps(gid);}
function rmLinked(gid,eid){const g=G.find(x=>x.id===gid);if(g)g.linked=g.linked.filter(l=>l.id!==eid);renderList();openProps(gid);}
function setRC(gid,eid,c){const g=G.find(x=>x.id===gid);if(!g)return;const l=g.linked.find(x=>x.id===eid);if(l)l.color=c;renderList();openProps(gid);}
function rmGauge(gid){G=G.filter(g=>g.id!==gid);if(editId===gid)editId=null;renderList();}

function closeSheet(id){document.getElementById(id+'Mask').classList.remove('show');document.getElementById('entSearch').style.display='';}

function goStep2(){
  document.getElementById('step1').classList.add('hide');document.getElementById('step2').classList.add('show');
  document.getElementById('stp1').className='stp d';document.getElementById('stp2').className='stp a';
  document.getElementById('nextBtn').textContent='SAVE';
  closeSheet('type');closeSheet('ent');renderReview();
}
function goStep1(){
  document.getElementById('step1').classList.remove('hide');document.getElementById('step2').classList.remove('show');
  document.getElementById('stp1').className='stp a';document.getElementById('stp2').className='stp';
  document.getElementById('nextBtn').textContent='REVIEW ▸';document.getElementById('nextBtn').onclick=goStep2;
}
function renderReview(){
  const el=document.getElementById('rvList');
  if(!G.length){el.innerHTML='<div class="rv-empty">No gauges configured.</div>';return;}
  el.innerHTML=G.map(g=>{
    const t=TYPES.find(x=>x.type===g.type);const col=C[g.type];
    let ents='';
    if(g.type==='multiring'){
      ents=g.linked.length?g.linked.map(l=>{const e=ENT.find(x=>x.id===l.id);return`<span style="color:${l.color}">●</span> ${e?.name||l.id} <span style="color:var(--text-3)">${e?.unit||''}</span>`;}).join(' · '):'—';
    } else {
      const e=g.primary!=null?ENT.find(x=>x.id===g.primary):null;
      ents=e?`${e.name} <span style="color:var(--text-3)">${e.unit||''}</span>`:'—';
    }
    return `<div class="rv-row"><div class="dot" style="background:${col}"></div><span class="tp" style="color:${col}">${t.name}</span><span class="ent">${ents}</span></div>`;
  }).join('');
}

function resetAll(){G=[];nid=1;editId=null;closeSheet('type');closeSheet('ent');goStep1();renderList();}

renderList();
</script>
</body>
</html>
